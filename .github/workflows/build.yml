name: Build JSX

on:
  push:
    branches: [ main ]
    paths: [ 'app.jsx', 'babel.config.json', '.github/workflows/build.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: npm install @babel/core @babel/cli @babel/preset-env @babel/preset-react

      - name: Compile app.jsx -> app.js
        run: npx babel app.jsx --out-file app.js

      - name: Commit compiled app.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "build: compile app.jsx -> app.js" || echo "no changes to commit"
          git push
